services:
  postgres:
    # pgvector build of Postgres 16 (same data format as postgres:16), needed
    # by Backend's assistant (vector column + HNSW index).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agotek
      POSTGRES_PASSWORD: agotek
      POSTGRES_DB: agotek_automation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
